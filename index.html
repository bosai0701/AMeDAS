<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AMeDAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">
<!-- MapLibre -->
<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>

<style>
/* ===== 基本レイアウト ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}
#map {
  width: 100%;
  height: 100%;
}

/* ===== UI ===== */
#ui {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 10;
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 6px;
  border-radius: 5px;
  font-size: 12px;
}
#time {
  margin-bottom: 3px;
  font-weight: bold;
}
select {
  font-size: 12px;
}

/* ===== 凡例 ===== */
#legend {
  position: absolute;
  bottom: 38px;
  right: 8px;
  z-index: 10;
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 6px;
  border-radius: 5px;
  font-size: 11px;
  line-height: 1.3em;
}
.legend-color {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 4px;
  vertical-align: middle;
}

/* ===== Google 著作権 ===== */
#google-attribution {
  position: absolute;
  right: 8px;
  bottom: 8px;
  z-index: 9;
  font-size: 11px;
  color: #fff;
  background: rgba(0,0,0,0.7);
  padding: 2px 6px;
  border-radius: 4px;
  pointer-events: none;
}

/* ===== ポップアップ ===== */
.semi-transparent-popup .maplibregl-popup-content {
  background: rgba(0,0,0,0.6);
  color: #fff;
  border-radius: 6px;
}

/* 矢印（全方向） */
.semi-transparent-popup.maplibregl-popup-anchor-top .maplibregl-popup-tip {
  border-bottom-color: rgba(0,0,0,0.6);
}
.semi-transparent-popup.maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
  border-top-color: rgba(0,0,0,0.6);
}
.semi-transparent-popup.maplibregl-popup-anchor-left .maplibregl-popup-tip {
  border-right-color: rgba(0,0,0,0.6);
}
.semi-transparent-popup.maplibregl-popup-anchor-right .maplibregl-popup-tip {
  border-left-color: rgba(0,0,0,0.6);
}
.semi-transparent-popup.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
.semi-transparent-popup.maplibregl-popup-anchor-top-right .maplibregl-popup-tip {
  border-bottom-color: rgba(0,0,0,0.6);
}
.semi-transparent-popup.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
.semi-transparent-popup.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip {
  border-top-color: rgba(0,0,0,0.6);
}
</style>
</head>

<body>
<div id="map"></div>

<div id="ui">
  <div id="time"></div>
  表示項目：
  <select id="elem">
    <option value="temp">気温(℃)</option>
    <option value="humidity">湿度(%)</option>
    <option value="precipitation10m">10分降水量(mm)</option>
    <option value="precipitation1h">1時間降水量(mm)</option>
    <option value="precipitation3h">3時間降水量(mm)</option>
    <option value="precipitation24h">24時間降水量(mm)</option>
    <option value="wind">風速(m/s)</option>
    <option value="sun1h">日照時間(h)</option>
    <option value="snow">積雪深(cm)</option>
    <option value="snow1h">1時間降雪量(cm)</option>
    <option value="snow6h">6時間降雪量(cm)</option>
    <option value="snow12h">12時間降雪量(cm)</option>
    <option value="snow24h">24時間降雪量(cm)</option>
  </select>
</div>

<div id="legend"></div>
<div id="google-attribution">© Google</div>

<script>
/* ===== Cookie ===== */
function setCookie(name, value, days = 365) {
  const d = new Date();
  d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
  document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
}
function getCookie(name) {
  const c = document.cookie.split(';').map(s => s.trim());
  for (const pair of c) {
    if (pair.startsWith(name + '=')) return pair.split('=')[1];
  }
  return null;
}

/* ===== MapLibre 初期化 ===== */
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      google: {
        type: 'raster',
        tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
        tileSize: 256
      }
    },
    layers: [
      { id: 'google', type: 'raster', source: 'google' }
    ]
  },
  center: [138, 35.2],
  zoom: 2.7,
  minZoom: 2,
  maxZoom: 9,
  pitch: 0,
  maxPitch: 65
});

/* ===== 時刻処理 ===== */
async function latestTime() {
  const t = await (await fetch('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt')).text();
  const d = new Date(t.trim());
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(Math.floor(d.getMinutes() / 10) * 10).padStart(2, '0');
  return `${yyyy}${mm}${dd}${hh}${mi}00`;
}
function truncateHour(timeStr, key) {
  if (key.startsWith('snow')) return timeStr.slice(0, 10) + '0000';
  return timeStr;
}
function formatTime(timeStr) {
  return `${timeStr.slice(0,4)}-${timeStr.slice(4,6)}-${timeStr.slice(6,8)} ${timeStr.slice(8,10)}:${timeStr.slice(10,12)}`;
}

/* ===== 色関数 ===== */
function tempColor(t) {
  if (t >= 35) return "rgb(180,0,104)";
  if (t >= 30) return "rgb(255,40,0)";
  if (t >= 25) return "rgb(255,153,0)";
  if (t >= 20) return "rgb(250,245,0)";
  if (t >= 15) return "rgb(255,255,150)";
  if (t >= 10) return "rgb(255,255,240)";
  if (t >= 5)  return "rgb(185,235,255)";
  if (t >= 0)  return "rgb(0,150,255)";
  if (t >= -4.9) return "rgb(0,65,255)";
  return "rgb(0,32,128)";
}
function sunColor(s) {
  if (s <= 0.1) return "rgb(0,65,255)";
  if (s <= 0.3) return "rgb(185,235,255)";
  if (s <= 0.5) return "rgb(250,245,0)";
  if (s <= 0.7) return "rgb(255,153,0)";
  if (s <= 0.9) return "rgb(255,40,0)";
  return "rgb(180,0,104)";
}
function precipitationColor(p) {
  if (p === 0 || p === null) return null;
  if (p <= 0.9) return null;
  if (p <= 4.9) return "rgb(160,210,255)";
  if (p <= 9.9) return "rgb(33,140,255)";
  if (p <= 19.9) return "rgb(0,65,255)";
  if (p <= 29.9) return "rgb(250,245,0)";
  if (p <= 49.9) return "rgb(255,153,0)";
  if (p <= 79.9) return "rgb(255,40,0)";
  return "rgb(180,0,104)";
}
function snowColor(s) {
  if (s === 0 || s === null) return null;
  if (s <= 5) return "rgb(160,210,255)";
  if (s <= 19) return "rgb(33,140,255)";
  if (s <= 49) return "rgb(0,65,255)";
  if (s <= 99) return "rgb(250,245,0)";
  if (s <= 149) return "rgb(255,153,0)";
  if (s <= 199) return "rgb(255,40,0)";
  return "rgb(180,0,104)";
}
function windColor(w) {
  if (w === 0 || w === null) return null;
  if (w <= 5.9) return "rgb(242,242,255)";
  if (w <= 9.9) return "rgb(0,65,255)";
  if (w <= 14.9) return "rgb(250,245,0)";
  if (w <= 19.9) return "rgb(255,153,0)";
  if (w <= 24.9) return "rgb(255,40,0)";
  return "rgb(180,0,104)";
}
function humidityColor(h) {
  if (h <= 9) return "rgb(84,6,0)";
  if (h <= 19) return "rgb(118,17,0)";
  if (h <= 29) return "rgb(171,74,1)";
  if (h <= 39) return "rgb(231,135,7)";
  if (h <= 49) return "rgb(255,200,70)";
  if (h <= 59) return "rgb(255,255,240)";
  if (h <= 69) return "rgb(128,248,231)";
  if (h <= 79) return "rgb(31,194,211)";
  if (h <= 89) return "rgb(0,114,154)";
  if (h <= 99) return "rgb(0,75,150)";
  return "rgb(1,31,125)";
}
function getColor(key, value) {
  if (key === 'temp') return tempColor(value);
  if (key === 'humidity') return humidityColor(value);
  if (key.startsWith('sun')) return sunColor(value);
  if (key.startsWith('precipitation')) return precipitationColor(value);
  if (key.startsWith('snow')) return snowColor(value);
  if (key === 'wind') return windColor(value);
  return '#00ffff';
}

/* ===== ポップアップ ===== */
const popup = new maplibregl.Popup({
  closeButton: true,
  closeOnClick: true,
  className: 'semi-transparent-popup'
});
let lastKey = null;

/* ===== 凡例 ===== */
const legend = document.getElementById('legend');
function updateLegend(key) {
  const items = [];
  switch (key) {
    case 'temp':
      items.push(
        ["-5 以下","0,32,128"],["-4.9〜-0.1","0,65,255"],["0〜4.9","0,150,255"],
        ["5〜9.9","185,235,255"],["10〜14.9","255,255,240"],["15〜19.9","255,255,150"],
        ["20〜24.9","250,245,0"],["25〜29.9","255,153,0"],["30〜34.9","255,40,0"],["35 以上","180,0,104"]
      );
      break;
    case 'humidity':
      items.push(
        ["0〜9","84,6,0"],["10〜19","118,17,0"],["20〜29","171,74,1"],
        ["30〜39","231,135,7"],["40〜49","255,200,70"],["50〜59","255,255,240"],
        ["60〜69","128,248,231"],["70〜79","31,194,211"],["80〜89","0,114,154"],
        ["90〜99","0,75,150"],["100","1,31,125"]
      );
      break;
    case 'sun1h':
      items.push(
        ["0.0〜0.1","0,65,255"],["0.2〜0.3","185,235,255"],["0.4〜0.5","250,245,0"],
        ["0.6〜0.7","255,153,0"],["0.8〜0.9","255,40,0"],["1.0","180,0,104"]
      );
      break;
    case 'wind':
      items.push(
        ["0〜5.9","242,242,255"],["6〜9.9","0,65,255"],["10〜14.9","250,245,0"],
        ["15〜19.9","255,153,0"],["20〜24.9","255,40,0"],["25 以上","180,0,104"]
      );
      break;
    case 'precipitation10m':
    case 'precipitation1h':
    case 'precipitation3h':
    case 'precipitation24h':
      items.push(
        ["0〜0.9","242,242,255"],["1〜4.9","160,210,255"],["5〜9.9","33,140,255"],
        ["10〜19.9","0,65,255"],["20〜29.9","250,245,0"],["30〜49.9","255,153,0"],
        ["50〜79.9","255,40,0"],["80以上","180,0,104"]
      );
      break;
    case 'snow':
    case 'snow1h':
    case 'snow6h':
    case 'snow12h':
    case 'snow24h':
      items.push(
        ["5 以下","160,210,255"],["6〜19","33,140,255"],["20〜49","0,65,255"],
        ["50〜99","250,245,0"],["100〜149","255,153,0"],["150〜199","255,40,0"],["200以上","180,0,104"]
      );
      break;
  }
  legend.innerHTML = '';
  items.reverse().forEach(([label, color]) => {
    const div = document.createElement('div');
    div.innerHTML = `<span class="legend-color" style="background:rgb(${color})"></span>${label}`;
    legend.appendChild(div);
  });
}

/* ===== 描画 ===== */
async function draw(key) {
  updateLegend(key);

  if (lastKey && lastKey !== key && popup.isOpen()) popup.remove();
  lastKey = key;

  const latest = await latestTime();
  const fetchTime = truncateHour(latest, key);
  document.getElementById('time').textContent = `時刻: ${formatTime(fetchTime)}`;

  let data, table;
  try {
    data = await (await fetch(`https://www.jma.go.jp/bosai/amedas/data/map/${fetchTime}.json`)).json();
    table = await (await fetch('https://www.jma.go.jp/bosai/amedas/const/amedastable.json')).json();
  } catch {
    return;
  }

  const features = [];
  for (const code in data) {
    const point = data[code];
    if (!point[key]) continue;

    const value = point[key][0];
    if ((key.startsWith('precipitation') || key.startsWith('snow') || key === 'wind') && (value === 0 || value === null)) continue;
    if (value === null) continue;

    const info = table[code];
    if (!info || !info.lat || !info.lon) continue;

    const lat = Number(info.lat[0]) + Number(info.lat[1] || 0) / 60;
    const lon = Number(info.lon[0]) + Number(info.lon[1] || 0) / 60;
    if (isNaN(lat) || isNaN(lon)) continue;

    const color = getColor(key, value);
    if (!color) continue;

    features.push({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [lon, lat] },
      properties: {
        name: info.kjName || code,
        value,
        color
      }
    });
  }

  const geojson = { type: 'FeatureCollection', features };

  if (map.getSource('amedas')) {
    map.getSource('amedas').setData(geojson);
  } else {
    map.addSource('amedas', { type: 'geojson', data: geojson });

    map.addLayer({
      id: 'amedas-point-display',
      type: 'circle',
      source: 'amedas',
      paint: {
        'circle-radius': 2.5,
        'circle-color': ['get', 'color'],
        'circle-opacity': 1
      }
    });

    map.addLayer({
      id: 'amedas-point-hit',
      type: 'circle',
      source: 'amedas',
      paint: {
        'circle-radius': 15,
        'circle-opacity': 0
      }
    });

    map.on('click', 'amedas-point-hit', e => {
      const f = e.features[0];
      let valueText = f.properties.value;

      switch (elem.value) {
        case 'temp': valueText = `気温: ${valueText} ℃`; break;
        case 'humidity': valueText = `湿度: ${valueText} %`; break;
        case 'precipitation10m': valueText = `降水量10m: ${valueText} mm`; break;
        case 'precipitation1h': valueText = `降水量1h: ${valueText} mm`; break;
        case 'precipitation3h': valueText = `降水量3h: ${valueText} mm`; break;
        case 'precipitation24h': valueText = `降水量24h: ${valueText} mm`; break;
        case 'wind': valueText = `風速: ${valueText} m/s`; break;
        case 'sun1h': valueText = `日照時間: ${valueText} h`; break;
        case 'snow': valueText = `積雪深: ${valueText} cm`; break;
        case 'snow1h': valueText = `降雪量1h: ${valueText} cm`; break;
        case 'snow6h': valueText = `降雪量6h: ${valueText} cm`; break;
        case 'snow12h': valueText = `降雪量12h: ${valueText} cm`; break;
        case 'snow24h': valueText = `降雪量24h: ${valueText} cm`; break;
      }

      popup
        .setLngLat(f.geometry.coordinates)
        .setHTML(`<strong>${f.properties.name}</strong><br>${valueText}`)
        .addTo(map);
    });

    map.on('mouseenter', 'amedas-point-hit', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'amedas-point-hit', () => map.getCanvas().style.cursor = '');
  }
}

/* ===== 初期描画 ===== */
(function waitDraw() {
  if (map.isStyleLoaded()) draw(elem.value);
  else setTimeout(waitDraw, 50);
})();

/* ===== select & Cookie ===== */
const elem = document.getElementById('elem');
const lastElem = getCookie('amedas_elem');
if (lastElem) elem.value = lastElem;

elem.onchange = e => {
  setCookie('amedas_elem', e.target.value);
  draw(e.target.value);
};

/* ===== 定期更新 ===== */
setInterval(() => draw(elem.value), 1000);
</script>
</body>
</html>
