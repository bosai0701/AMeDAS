/* =========================================================
   Cookie
========================================================= */

function setCookie(n, v, d = 365) {
  const e = new Date();
  e.setTime(e.getTime() + d * 864e5);
  document.cookie =
    `${n}=${v};expires=${e.toUTCString()};path=/`;
}

function getCookie(n) {
  for (
    const p of document.cookie
      .split(';')
      .map(s => s.trim())
  ) {
    if (p.startsWith(n + '=')) {
      return p.split('=')[1];
    }
  }
  return null;
}

/* =========================================================
   時刻
========================================================= */

async function latestTime() {

  const response = await fetch(
    'https://www.jma.go.jp/bosai/amedas/data/latest_time.txt',
    {
      cache: 'no-store'
    }
  );

  const t = await response.text();

  const d = new Date(t.trim());

  const pad = n =>
    String(n).padStart(2,'0');

  return `${d.getFullYear()}${
    pad(d.getMonth() + 1)
  }${
    pad(d.getDate())
  }${
    pad(d.getHours())
  }${
    pad(Math.floor(d.getMinutes() / 10) * 10)
  }00`;
}


function truncateHour(s, key) {

  return key.startsWith('snow')
    ? s.slice(0,10) + '0000'
    : s;
}


function formatTime(s) {

  return `${s.slice(0,4)}-${
    s.slice(4,6)
  }-${
    s.slice(6,8)
  } ${
    s.slice(8,10)
  }:${
    s.slice(10,12)
  }`;
}


function subtractMinutes(s, min) {

  const d = new Date(
    +s.slice(0,4),
    +s.slice(4,6) - 1,
    +s.slice(6,8),
    +s.slice(8,10),
    +s.slice(10,12)
  );

  d.setMinutes(d.getMinutes() - min);

  const pad = n =>
    String(n).padStart(2,'0');

  return `${d.getFullYear()}${
    pad(d.getMonth() + 1)
  }${
    pad(d.getDate())
  }${
    pad(d.getHours())
  }${
    pad(d.getMinutes())
  }00`;
}

/* =========================================================
   色判定
========================================================= */

function getColor(key, val) {

  const legendData =
    elementLegends[key];

  if (!legendData)
    return '#0ff';

  let result = null;

  for (const [threshold, color] of legendData) {

    if (val >= threshold) {
      result = color;
    } else {
      break;
    }
  }

  return result;
}


/* =========================================================
   凡例表示
========================================================= */

function updateLegend(key) {

  const data =
    elementLegends[key] || [];

  legend.innerHTML =
    data
      .map(([value, color]) => {

        return `
          <div>
            <span
              class="legend-color"
              style="background:${color}"
            ></span>${value}
          </div>
        `;

      })
      .reverse()
      .join('');
}


/* =========================================================
   ポップアップ
========================================================= */

const popup = new maplibregl.Popup({
  closeButton: true,
  closeOnClick: true,
  className: 'semi-transparent-popup'
});

let lastKey = null;


/* =========================================================
   進捗
========================================================= */

function updateProgress(val) {

  const pct =
    (val / MAX_STEPS) * 100;

  sliderProgress.style.width =
    pct + '%';
}


/* =========================================================
   JMA用step
========================================================= */

function getActualStep() {

  return MAX_STEPS -
    (+slider.value);
}


/* =========================================================
   描画
========================================================= */

async function draw(
  key,
  step = 0,
  knownLatest = null
) {

  updateLegend(key);

  if (
    lastKey &&
    lastKey !== key &&
    popup.isOpen()
  ) {
    popup.remove();
  }

  lastKey = key;

  const latest =
    knownLatest ||
    await latestTime();

  const min =
    step * 10;

  const target =
    min === 0
      ? latest
      : subtractMinutes(
          latest,
          min
        );

  const fetchTime =
    truncateHour(
      target,
      key
    );

  document.getElementById('time')
    .textContent =
      formatTime(fetchTime);


  /* LIVE / PAST */

  const sliderOffsetEl =
    document.getElementById(
      'slider-offset'
    );

  if (min === 0) {

    sliderOffsetEl.textContent =
      'LIVE';

    liveBadge.className = '';

    liveBadge.querySelector('span')
      .textContent = 'LIVE';

  } else {

    const h =
      Math.floor(min / 60);

    const m =
      min % 60;

    sliderOffsetEl.textContent =
      h > 0
        ? `-${h}h${m > 0 ? m + 'm' : ''}`
        : `-${m}m`;

    liveBadge.className =
      'past';

    liveBadge.querySelector('span')
      .textContent = 'PAST';
  }


  /* =====================================================
     データ取得
  ===================================================== */

  let data;
  let table;

  try {

    [
      data,
      table
    ] = await Promise.all([

      fetch(
        `https://www.jma.go.jp/bosai/amedas/data/map/${fetchTime}.json`,
        {
          cache: 'no-store'
        }
      ).then(r => r.json()),

      fetch(
        'https://www.jma.go.jp/bosai/amedas/const/amedastable.json',
        {
          cache: 'no-store'
        }
      ).then(r => r.json())

    ]);

  } catch {

    return;
  }


  /* =====================================================
     GeoJSON
  ===================================================== */

  const features = [];

  for (const code in data) {

    const pt =
      data[code];

    if (!pt[key])
      continue;

    const val =
      pt[key][0];

    if (val === null)
      continue;

    if (
      (
        key.startsWith('precipitation') ||
        key.startsWith('snow') ||
        key === 'wind'
      ) &&
      val === 0
    ) {
      continue;
    }

    const info =
      table[code];

    if (
      !info?.lat ||
      !info?.lon
    ) {
      continue;
    }

    const lat =
      +info.lat[0] +
      (+info.lat[1] || 0) / 60;

    const lon =
      +info.lon[0] +
      (+info.lon[1] || 0) / 60;

    if (
      isNaN(lat) ||
      isNaN(lon)
    ) {
      continue;
    }

    const color =
      getColor(
        key,
        val
      );

    if (!color)
      continue;

    features.push({

      type: 'Feature',

      geometry: {
        type: 'Point',
        coordinates: [
          lon,
          lat
        ]
      },

      properties: {

        name:
          info.kjName ||
          code,

        val,

        color
      }
    });
  }


  const geojson = {

    type:
      'FeatureCollection',

    features
  };


  /* =====================================================
     MapLibre
  ===================================================== */

  if (
    map.getSource('amedas')
  ) {

    map.getSource('amedas')
      .setData(geojson);

  } else {

    map.addSource(
      'amedas',
      {
        type: 'geojson',
        data: geojson
      }
    );


    map.addLayer({

      id:
        'amedas-pts',

      type:
        'circle',

      source:
        'amedas',

      paint: {

        'circle-radius':
          2.5,

        'circle-color':
          ['get', 'color'],

        'circle-opacity':
          1
      }

    });


    map.addLayer({

      id:
        'amedas-hit',

      type:
        'circle',

      source:
        'amedas',

      paint: {

        'circle-radius':
          14,

        'circle-opacity':
          0
      }

    });


    const unitMap = {

      temp: '℃',
      humidity: '%',

      precipitation10m: 'mm',
      precipitation1h: 'mm',
      precipitation3h: 'mm',
      precipitation24h: 'mm',

      wind: 'm/s',

      sun1h: 'h',

      snow: 'cm',
      snow1h: 'cm',
      snow6h: 'cm',
      snow12h: 'cm',
      snow24h: 'cm'
    };


    const nameMap = {

      temp: '気温',
      humidity: '湿度',

      precipitation10m:
        '降水量10分',

      precipitation1h:
        '降水量1時間',

      precipitation3h:
        '降水量3時間',

      precipitation24h:
        '降水量24時間',

      wind:
        '風速',

      sun1h:
        '日照時間',

      snow:
        '積雪深',

      snow1h:
        '降雪1時間',

      snow6h:
        '降雪6時間',

      snow12h:
        '降雪12時間',

      snow24h:
        '降雪24時間'
    };


    map.on(
      'click',
      'amedas-hit',
      e => {

        const f =
          e.features[0];

        const k =
          elem.value;

        popup
          .setLngLat(
            f.geometry.coordinates
          )
          .setHTML(
            `<strong>${
              f.properties.name
            }</strong>` +
            `${nameMap[k]}: ` +
            `${f.properties.val} ` +
            `${unitMap[k]}`
          )
          .addTo(map);
      }
    );


    map.on(
      'mouseenter',
      'amedas-hit',
      () => {

        map.getCanvas()
          .style.cursor =
          'pointer';
      }
    );


    map.on(
      'mouseleave',
      'amedas-hit',
      () => {

        map.getCanvas()
          .style.cursor =
          '';
      }
    );
  }
}


/* =========================================================
   初期化
========================================================= */

const savedElem =
  getCookie('amedas_elem');

if (savedElem) {
  elem.value =
    savedElem;
}

(function wait() {

  if (
    map.isStyleLoaded()
  ) {

    slider.value =
      String(MAX_STEPS);

    updateProgress(
      MAX_STEPS
    );

    draw(
      elem.value,
      getActualStep()
    );

  } else {

    setTimeout(
      wait,
      50
    );
  }

})();


/* =========================================================
   表示項目変更
========================================================= */

elem.onchange =
  e => {

    setCookie(
      'amedas_elem',
      e.target.value
    );

    draw(
      e.target.value,
      getActualStep()
    );
  };


/* =========================================================
   スライダー操作
========================================================= */

slider.oninput =
  e => {

    const uiValue =
      +e.target.value;

    updateProgress(
      uiValue
    );

    const actualStep =
      MAX_STEPS -
      uiValue;

    draw(
      elem.value,
      actualStep
    );
  };


/* =========================================================
   最新データ自動監視
========================================================= */

let lastLatestTime = null;
let checkingLatest = false;

async function checkForNewData() {

  if (checkingLatest)
    return;

  checkingLatest = true;

  try {

    const latest =
      await latestTime();

    if (
      lastLatestTime === null
    ) {

      lastLatestTime =
        latest;

      return;
    }

    if (
      latest !==
      lastLatestTime
    ) {

      lastLatestTime =
        latest;

      await draw(
        elem.value,
        getActualStep(),
        latest
      );
    }

  } catch {

  } finally {

    checkingLatest =
      false;
  }
}


/* 10秒ごとに確認 */

setInterval(
  checkForNewData,
  10000
);


/* 初回 */

setTimeout(
  checkForNewData,
  1000
);

</script>
